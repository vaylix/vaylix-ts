name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Restore turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.workflow }}-${{ github.ref_name }}-${{ hashFiles('turbo.json', 'pnpm-lock.yaml', '**/package.json', '**/tsconfig*.json') }}
          restore-keys: |
            ${{ runner.os }}-turbo-${{ github.workflow }}-${{ github.ref_name }}-
            ${{ runner.os }}-turbo-${{ github.workflow }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check version alignment
        run: pnpm run version:check

      - name: Build workspace
        run: pnpm run build

      - name: Typecheck workspace
        run: pnpm run check

      - name: Run unit tests
        run: pnpm run test
