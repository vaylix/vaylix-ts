name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check version alignment
        run: npm run version:check

      - name: Build workspace
        run: npm run build

      - name: Typecheck workspace
        run: npm run check

      - name: Run unit tests
        run: npm run test
